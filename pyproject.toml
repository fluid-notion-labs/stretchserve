[project]
name = "stretchserve"
version = "0.1.0"
description = "Serve a directory of markdown with stretchtext (Nelson-style progressive text), mermaid and graphviz"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.7",
]

[project.scripts]
stretchserve = "stretchserve.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stretchserve"]
